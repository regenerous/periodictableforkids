name: Deploy Periodic Table for Kids to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the site
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install test tools
        run: npm ci
      - name: Run interaction tests
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 &
          sleep 1
          npm test

  release:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Check out the release files
        uses: actions/checkout@v4
      - name: Publish the matching GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="v$(cat VERSION)"
          if gh release view "$version" >/dev/null 2>&1; then
            echo "$version is already published"
          elif git ls-remote --exit-code --tags origin "refs/tags/$version" >/dev/null; then
            gh release create "$version" --title "Periodic Table for Kids $version" --notes-file CHANGELOG.md
          else
            echo "Tag $version is not available yet; skipping release creation"
          fi

  deploy:
    needs: [test, release]
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out the site
        uses: actions/checkout@v4
      - name: Set up GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload the static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Publish the site
        id: deployment
        uses: actions/deploy-pages@v4
